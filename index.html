        .regra-item { border-left: 4px solid var(--cor-turquesa); }
        .sidebar-regras {

        .btn-primary {
            background: linear-gradient(135deg, var(--cor-laranja), var(--cor-turquesa));

            border-radius: 8px; transition: opacity 0.2s; cursor: pointer;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: #6B7280; color: white; font-weight: bold;
            padding: 12px 24px; border-radius: 8px;
            transition: background 0.2s; cursor: pointer;
        }
        .btn-secondary:hover { background: #4B5563; }
        .btn-danger {
            background: #EF4444; color: white; font-weight: bold;
            padding: 12px 24px; border-radius: 8px;
            transition: background 0.2s; cursor: pointer;
        }
        .btn-danger:hover { background: #DC2626; }
        .badge-prioritaria {
            background: #FEE2E2; color: #DC2626;
            padding: 2px 10px; border-radius: 999px;
            font-size: 0.75rem; font-weight: bold;
        }
        .badge-verificacao {
            background: #D1FAE5; color: #065F46;
            padding: 2px 10px; border-radius: 999px;
            font-size: 0.75rem; font-weight: bold;
        }
        .badge-padrao {
            background: #DBEAFE; color: #1E40AF;
            padding: 2px 10px; border-radius: 999px;
            font-size: 0.75rem; font-weight: bold;
        }
        .aviso-dia-especial {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border-left: 4px solid #F59E0B; border-radius: 8px;
            padding: 16px; margin-bottom: 16px;
        }
        .contador-rapido {
            display: flex; align-items: center; gap: 12px;
            background: #F3F4F6; border-radius: 12px; padding: 16px;
        }
        .contador-btn {
            width: 44px; height: 44px; border-radius: 50%;
            font-size: 1.5rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.1s; border: none;
        }
        .contador-btn:active { transform: scale(0.9); }
        .contador-valor {
            font-size: 2.5rem; font-weight: bold;
            min-width: 60px; text-align: center; color: var(--cor-escuro);
        }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background: var(--cor-escuro); color: white; }

        /* Notificações */
        .notif-badge {
            position: absolute; top: -6px; right: -6px;
            background: #EF4444; color: white; border-radius: 999px;
            font-size: 0.65rem; font-weight: bold;
            min-width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
        }
        .notif-card {
            border-left: 4px solid #EF4444;
            transition: all 0.2s;
        }
        .notif-card.vista { border-left-color: #F59E0B; opacity: 0.8; }
        .notif-card.resolvida { border-left-color: #10B981; opacity: 0.6; }
        @keyframes pulseAlert {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        .pulse-alert { animation: pulseAlert 1.5s infinite; }
    </style>
</head>

        function getDiaSemanaAtual() {
            const dias = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
            return dias[new Date().getDay()];
        }
        function isDiaEspecial() {
            const dia = getDiaSemanaAtual();
            return dia === 'segunda' || dia === 'quarta';
        }
        function getNomeDia() {
            const nomes = {
                'domingo':'Domingo','segunda':'Segunda-feira','terca':'Terça-feira',
                'quarta':'Quarta-feira','quinta':'Quinta-feira','sexta':'Sexta-feira','sabado':'Sábado'
            };
            return nomes[getDiaSemanaAtual()];
        }
        function filtrarTarefasPorDia(tarefas) {
            const diaAtual = getDiaSemanaAtual();
            return tarefas.filter(t => {
                if (!t.dias_ocultar || t.dias_ocultar.length === 0) return true;
                return !t.dias_ocultar.includes(diaAtual);
            });
        }

        // ── SOM DE ALERTA ──────────────────────────────────────────
        function tocarSomAlerta() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const toques = [
                    { freq: 880, start: 0,   dur: 0.15 },
                    { freq: 660, start: 0.2, dur: 0.15 },
                    { freq: 880, start: 0.4, dur: 0.25 }
                ];
                toques.forEach(t => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = t.freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.4, ctx.currentTime + t.start);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t.start + t.dur);
                    osc.start(ctx.currentTime + t.start);
                    osc.stop(ctx.currentTime + t.start + t.dur + 0.05);
                });
            } catch(e) { console.log('Som não suportado:', e); }
        }

        class RotinaSequencial {
            constructor() {
                this.currentUser = null;
                this.isAdmin = false;
                this.periodo = null;
                this.tarefas = [];
                this.tarefaAtualIndex = 0;
                this.regras = [];
                this.metricas = { total_tarefas:0, concluidas:0, nao_deu_tempo:0, leads_atendidos:0 };
                this.timerInterval = null;
                this.timerSegundos = 0;
                this.timerAtivo = false;
                this.autoSaveInterval = null;
                this.metricasHistorico = [];
                this.rankingConsultores = [];
                this.statusPlataformas = { whatsapp_ok:false, ll_ok:false, rotina_ok:true };
                this.alertasNaoVistos = 0;
                this.alertaCheckInterval = null;
                this.verificarSessao();
            }

            async verificarSessao() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    this.currentUser = session.user;
                    await this.verificarAdmin();
                    await this.carregarDados();
                    this.iniciarAutoSave();
                    if (this.isAdmin) {
                        await this.verificarEGerarAlertas();
                        this.iniciarMonitorAlertas();
                    }
                    this.renderDashboard();
                } else {
                    this.renderLogin();
                }
            }

            async verificarAdmin() {
                const { data } = await supabase
                    .from('user_roles').select('is_admin')
                    .eq('user_id', this.currentUser.id).single();
                this.isAdmin = data?.is_admin || false;
            }

            // ── SISTEMA DE ALERTAS ─────────────────────────────────
            iniciarMonitorAlertas() {
                // Verifica badge a cada 60 segundos
                this.alertaCheckInterval = setInterval(async () => {
                    await this.atualizarBadgeAlertas();
                    // Verifica se deve gerar novos alertas (a cada hora, 9:30-12:00 e 14:00-18:00)
                    const agora = new Date();
                    const hora = agora.getHours();
                    const min = agora.getMinutes();
                    const dentroDoPeriodo = (hora === 9 && min >= 30) ||
                        (hora > 9 && hora < 12) ||
                        (hora >= 14 && hora < 18);
                    if (dentroDoPeriodo && min >= 0 && min <= 1) {
                        await this.verificarEGerarAlertas();
                    }
                }, 60000);
            }

            async verificarEGerarAlertas() {
                const hoje = new Date().toISOString().split('T')[0];
                const agora = new Date();
                const hora = agora.getHours();
                const min = agora.getMinutes();

                // Só gera alertas dentro do horário: 9:30-12:00 e 14:00-18:00
                const dentroDoPeriodo = (hora === 9 && min >= 30) ||
                    (hora > 9 && hora < 12) ||
                    (hora >= 14 && hora < 18);
                if (!dentroDoPeriodo) return;

                // Busca todos os consultores
                const { data: consultores } = await supabase
                    .from('user_credentials').select('user_id, nome, email');
                if (!consultores || consultores.length === 0) return;

                for (const consultor of consultores) {
                    // Verifica se já gerou alerta para esse consultor na última hora
                    const umaHoraAtras = new Date(agora.getTime() - 60 * 60 * 1000).toISOString();
                    const { data: alertaRecente } = await supabase
                        .from('alertas_gestao')
                        .select('id')
                        .eq('consultor_id', consultor.user_id)
                        .eq('data', hoje)
                        .gte('criado_em', umaHoraAtras)
                        .limit(1);
                    if (alertaRecente && alertaRecente.length > 0) continue;

                    // Verifica progresso do dia
                    const { data: progresso } = await supabase
                        .from('progresso_diario').select('*')
                        .eq('user_id', consultor.user_id)
                        .eq('data', hoje);

                    let motivoAlerta = null;

                    if (!progresso || progresso.length === 0) {
                        motivoAlerta = `${consultor.nome || consultor.email} não iniciou nenhuma rotina hoje`;
                    } else {
                        const emAndamento = progresso.find(p => p.status === 'em_andamento' || p.status === 'pausado');
                        if (emAndamento) {
                            const ultimaAtividade = new Date(emAndamento.updated_at || emAndamento.iniciado_em);
                            const diffMin = (agora - ultimaAtividade) / 1000 / 60;
                            if (diffMin > 60) {
                                motivoAlerta = `${consultor.nome || consultor.email} está sem atividade há mais de 1 hora`;
                            }
                        }
                    }

                    if (motivoAlerta) {
                        await this.criarAlerta(consultor.user_id, consultor.nome || consultor.email, motivoAlerta, hoje);
                    }
                }

                await this.atualizarBadgeAlertas();
            }

            async criarAlerta(consultorId, consultorNome, motivo, data) {
                const { error } = await supabase.from('alertas_gestao').insert({
                    consultor_id: consultorId,
                    consultor_nome: consultorNome,
                    motivo: motivo,
                    data: data,
                    status: 'novo',
                    criado_em: new Date().toISOString()
                });
                if (!error) {
                    tocarSomAlerta();
                    this.alertasNaoVistos++;
                    this.atualizarBadgeAlertas();
                }
            }

            async atualizarBadgeAlertas() {
                const { data, error } = await supabase
                    .from('alertas_gestao')
                    .select('id', { count: 'exact' })
                    .in('status', ['novo', 'visto']);
                if (!error) {
                    this.alertasNaoVistos = data?.length || 0;
                    const badge = document.getElementById('badgeAlertas');
                    if (badge) {
                        badge.textContent = this.alertasNaoVistos;
                        badge.style.display = this.alertasNaoVistos > 0 ? 'flex' : 'none';
                        if (this.alertasNaoVistos > 0) {
                            badge.parentElement.classList.add('pulse-alert');
                        } else {
                            badge.parentElement.classList.remove('pulse-alert');
                        }
                    }
                }
            }
async renderPainelOperacional(consultorId = 'todos', dataInicio = null, dataFim = null) {
    // Carrega a lista de consultores para o filtro
    const consultores = await this.getConsultoresCadastrados();

    // Define as datas padrão se não forem passadas
    const hoje = this.getDataSaoPaulo();
    if (!dataInicio) dataInicio = hoje;
    if (!dataFim) dataFim = hoje;

    // Busca alertas (mantemos a lógica de alertas aqui, mas com filtro de data)

        queryAlertas = queryAlertas.eq('consultor_id', consultorId);
    }

                               .lte('criado_em', `${dataFim}T23:59:59.999Z`)
                               .order('criado_em', { ascending: false });
    const { data: alertas, error: errorAlertas } = await queryAlertas;

    // Busca falhas por tarefa (com filtro de consultor e data)
    const { data: falhasPorTarefa, error: errorFalhas } = await supabase.rpc('get_falhas_por_periodo_filtrado', {

    }
    queryProgressoDiario = queryProgressoDiario.eq('data', hoje); // Sempre mostra o progresso de hoje
    const { data: progressoDiarioHoje, error: errorProgresso } = await queryProgressoDiario;

    // Renderiza cards de alerta
    const renderCardAlerta = (a) => {

    let progressoAoVivoHtml = '<p class="text-gray-400 text-sm text-center py-4">Nenhum consultor iniciou a rotina hoje ou não há dados para o filtro.</p>';
    if (progressoDiarioHoje && progressoDiarioHoje.length > 0) {

                <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

            async fazerCadastro() {
                const nome = document.getElementById('cadNome').value.trim();
                const email = document.getElementById('cadEmail').value.trim();
                const senha = document.getElementById('cadSenha').value;
                const confirmar = document.getElementById('cadConfirmar').value;

                if (senha.length < 6) {

                }
                if (senha !== confirmar) {

                btn.textContent = 'Cadastrando...';

getDataSaoPaulo(diasAtras = 0) {
    const agora = new Date();
    // Ajusta para UTC-3 (São Paulo)
    const sp = new Date(agora.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
    sp.setDate(sp.getDate() - diasAtras);
    const ano = sp.getFullYear();
    const mes = String(sp.getMonth() + 1).padStart(2, '0');
    const dia = String(sp.getDate()).padStart(2, '0');
    return `${ano}-${mes}-${dia}`;
}

            iniciarAutoSave() {
                if (this.autoSaveInterval) clearInterval(this.autoSaveInterval);
                this.autoSaveInterval = setInterval(() => {
                    if (this.periodo && this.tarefas.length > 0) this.salvarProgresso();
                }, 30000);
            }

            iniciarTimer() {
                this.pararTimer();
                this.timerSegundos = 300;
                this.timerAtivo = true;
                this.atualizarDisplayTimer();
                this.timerInterval = setInterval(() => {
                    this.timerSegundos--;
                    this.atualizarDisplayTimer();
                    if (this.timerSegundos <= 0) { this.pararTimer(); this.alertaTimer(); }
                }, 1000);
            }

            pararTimer() {
                if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
                this.timerAtivo = false;
            }

            resetarTimer() {
                this.pararTimer();
                this.timerSegundos = 300;
                this.timerAtivo = true;
                this.atualizarDisplayTimer();
                this.timerInterval = setInterval(() => {
                    this.timerSegundos--;
                    this.atualizarDisplayTimer();
                    if (this.timerSegundos <= 0) { this.pararTimer(); this.alertaTimer(); }
                }, 1000);
            }

            atualizarDisplayTimer() {
                const el = document.getElementById('timerDisplay');
                if (!el) return;
                const min = Math.floor(this.timerSegundos / 60);
                const seg = this.timerSegundos % 60;
                el.textContent = `${String(min).padStart(2,'0')}:${String(seg).padStart(2,'0')}`;
                const circle = document.getElementById('timerCircle');
                if (!circle) return;
                circle.className = 'timer-circle';
                if (this.timerSegundos > 180) circle.classList.add('timer-ok');
                else if (this.timerSegundos > 60) circle.classList.add('timer-warning');
                else circle.classList.add('timer-danger');
            }

            alertaTimer() {
                const el = document.getElementById('timerDisplay');
                if (el) el.textContent = '00:00';
                const circle = document.getElementById('timerCircle');
                if (circle) { circle.className = 'timer-circle timer-danger'; circle.innerHTML = '⚠️'; }

async iniciarRotina(periodo) {
    this.periodo = periodo;
    const { data: templates } = await supabase
        .from('rotina_templates').select('*')
        .eq('periodo', periodo).order('ordem');
    if (!templates || templates.length === 0) {
        alert('❌ Nenhuma tarefa encontrada para este período!'); return;
    }
    const tarefasFiltradas = filtrarTarefasPorDia(templates);
    const hoje = this.getDataSaoPaulo(); // Usa a data de São Paulo
    const { data: progressoSalvo } = await supabase
        .from('progresso_diario').select('*')
        .eq('user_id', this.currentUser.id).eq('data', hoje).eq('periodo', periodo).single();

    if (progressoSalvo && (progressoSalvo.status === 'em_andamento' || progressoSalvo.status === 'pausado')) {
        const continuar = confirm('Você tem uma rotina em andamento! Deseja continuar de onde parou?');
        if (continuar) {
            this.tarefas = progressoSalvo.progresso.tarefas;
            this.tarefaAtualIndex = progressoSalvo.tarefa_atual_index;
            this.metricas = progressoSalvo.metricas;
            this.renderTarefaAtual(); return;
        }
    }

    this.tarefas = tarefasFiltradas.map((t, index) => ({
        ...t, index, status:'pendente',
        motivo_nao_concluida:null, horario_conclusao:null, contador_valor:0
    }));
    this.tarefaAtualIndex = 0;
    this.metricas = { total_tarefas:this.tarefas.length, concluidas:0, nao_deu_tempo:0, leads_atendidos:0 };

    await supabase.from('progresso_diario').upsert({
        user_id: this.currentUser.id, data: hoje, periodo,
        tarefa_atual_index: 0, progresso: { tarefas: this.tarefas },
        metricas: this.metricas, status:'em_andamento', iniciado_em: new Date().toISOString()
    }, { onConflict:'user_id,data,periodo' });

    this.renderTarefaAtual();
}

            async concluirTarefa() {
                const tarefa = this.tarefas[this.tarefaAtualIndex];
                tarefa.status = 'concluida';
                tarefa.horario_conclusao = new Date().toISOString();
                this.metricas.concluidas++;
                this.pararTimer();
                await this.salvarProgresso();
                await this.proximaTarefa();
            }

            async proximaTarefa() {
                if (this.tarefaAtualIndex < this.tarefas.length - 1) {
                    this.tarefaAtualIndex++;
                    await this.salvarProgresso();
                    this.renderTarefaAtual();
                } else {
                    await this.finalizarRotina();
                }
            }

            async tarefaAnterior() {
                if (this.tarefaAtualIndex > 0) {
                    this.tarefaAtualIndex--;
                    this.pararTimer();
                    await this.salvarProgresso();
                    this.renderTarefaAtual();
                }
            }

            async irParaTarefa(index) {
                this.tarefaAtualIndex = index;

            async confirmarNaoDeuTempo() {
                const motivoSel = document.querySelector('input[name="motivo"]:checked');
                if (!motivoSel) { alert('❌ Selecione um motivo!'); return; }
                let motivo = motivoSel.value;
                if (motivo === 'outro') {
                    const txt = document.getElementById('outroMotivoTexto').value.trim();
                    if (!txt) { alert('❌ Digite o motivo específico!'); return; }
                    motivo = txt;
                }
                const tarefa = this.tarefas[this.tarefaAtualIndex];
                tarefa.status = 'nao_deu_tempo';
                tarefa.motivo_nao_concluida = motivo;
                tarefa.horario_conclusao = new Date().toISOString();
                this.metricas.nao_deu_tempo++;
                this.pararTimer();
                this.fecharModalNaoDeuTempo();
                await this.salvarProgresso();
                await this.proximaTarefa();
            }

            refazerTarefa() {
                const tarefa = this.tarefas[this.tarefaAtualIndex];
                if (tarefa.status === 'nao_deu_tempo') {
                    tarefa.status = 'pendente';
                    tarefa.motivo_nao_concluida = null;
                    tarefa.horario_conclusao = null;
                    this.metricas.nao_deu_tempo--;
                    this.renderTarefaAtual();
                }
            }

            calcularProgresso() {
                const total = this.tarefas.length;
                if (total === 0) return 0;
                const realizadas = this.tarefas.filter(t => t.status === 'concluida' || t.status === 'nao_deu_tempo').length;
                return Math.round((realizadas / total) * 100);
            }

            async executarAlterarSenha(userId) {
                const novaSenha = document.getElementById('novaSenhaInput').value;
                const confirmar = document.getElementById('confirmarSenhaInput').value;
                const msgEl = document.getElementById('msgAlterarSenha');
                const btn = document.getElementById('btnAlterarSenha');
                if (!novaSenha || !confirmar) {
                    msgEl.innerHTML = '<p class="text-red-600 text-sm">❌ Preencha os dois campos!</p>'; return;
                }
                if (novaSenha.length < 6) {
                    msgEl.innerHTML = '<p class="text-red-600 text-sm">❌ Mínimo 6 caracteres!</p>'; return;
                }
                if (novaSenha !== confirmar) {
                    msgEl.innerHTML = '<p class="text-red-600 text-sm">❌ As senhas não coincidem!</p>'; return;
                }
                btn.textContent = 'Salvando...';
                btn.disabled = true;
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    const response = await fetch(EDGE_FUNCTION_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`
                        },
                        body: JSON.stringify({ target_user_id: userId, nova_senha: novaSenha })
                    });
                    const result = await response.json();
                    if (!response.ok || result.error) {
                        msgEl.innerHTML = `<p class="text-red-600 text-sm">❌ ${result.error || 'Erro ao alterar senha'}</p>`;
                        btn.textContent = 'Salvar Senha';
                        btn.disabled = false;
                        return;
                    }
                    await supabase.from('user_credentials')
                        .update({ senha_original: novaSenha }).eq('user_id', userId);
                    msgEl.innerHTML = '<p class="text-green-600 text-sm font-semibold">✅ Senha alterada com sucesso!</p>';
                    btn.textContent = 'Salvar Senha';
                    btn.disabled = false;
                    setTimeout(() => document.getElementById('modalAlterarSenha')?.remove(), 1500);
                } catch (err) {
                    msgEl.innerHTML = `<p class="text-red-600 text-sm">❌ Erro: ${err.message}</p>`;
                    btn.textContent = 'Salvar Senha';
                    btn.disabled = false;
                }
            }

            fecharModalAdmin() { document.getElementById('modalAdmin')?.remove(); }
async buscarFalhasPorTarefaComFiltro(consultorId = null, dataInicio = null, dataFim = null) {
    let query = supabase.rpc('get_falhas_por_periodo_filtrado');

    if (consultorId && consultorId !== 'todos') {
        query = query.eq('p_user_id', consultorId);
    }
    if (dataInicio) {
        query = query.gte('p_data_inicio', dataInicio);
    }
    if (dataFim) {
        query = query.lte('p_data_fim', dataFim);
    }

    const { data, error } = await query.limit(10);
    if (error) {
        console.error('Erro ao buscar falhas por tarefa com filtro:', error);
        return [];
    }
    return data;
}
            async confirmarAdmin() {
                const input = document.getElementById('senhaAdmin');
                if (!input) return;
                if (input.value.trim() !== '071727') {
                    alert('❌ Senha incorreta!'); input.value = ''; input.focus(); return;
                }
                try {
                    await supabase.from('user_roles').upsert(
                        { user_id: this.currentUser.id, is_admin: true },
                        { onConflict: 'user_id' }
                    );
                    this.isAdmin = true;
                    this.fecharModalAdmin();
                    alert('🎉 Modo Admin ativado com sucesso!');
                    await this.carregarDados();
                    await this.verificarEGerarAlertas();
                    this.iniciarMonitorAlertas();
                    this.renderDashboard();
                } catch (err) {
                    alert('❌ Erro ao ativar admin: ' + err.message);
                }
            }
        }

        const app = new RotinaSequencial();
